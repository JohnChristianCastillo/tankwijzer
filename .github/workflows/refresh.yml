name: Refresh prices

on:
  schedule:
    # Twice a day. DATS 24 moves prices daily, and scheduled runs drift by up to
    # an hour on GitHub Actions, which is normal and harmless here.
    - cron: "0 5 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if coverage dropped"
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # A job that runs for minutes looks identical to one that hung when the
      # log only arrives at the end.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Restore the published data and the archive
        run: |
          # No data branch yet is fine on a first run. A data branch that exists
          # but cannot be fetched is not: this job would build on nothing, and the
          # archive is the one thing that cannot be rebuilt. publish-data.sh would
          # refuse to push anyway, but failing here says why.
          mkdir -p frontend/public/data
          status=0
          git ls-remote --exit-code --heads origin data >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x
            cp -r data/. frontend/public/data/
            rm -rf data
            echo "restored: $(ls frontend/public/data | tr '\n' ' ')$(ls archive 2>/dev/null | sed 's/^/archive\//')"
          elif [ "$status" -eq 2 ]; then
            echo "no data branch yet, starting empty"
          else
            echo "could not reach the data branch (git exit $status)"
            exit 1
          fi

      - name: Build the snapshot
        working-directory: backend
        run: python tools/snapshot.py ${{ inputs.force && '--force' || '' }}

      - name: Update the price history
        working-directory: backend
        # A failed history update keeps the previous history.json from the data
        # branch, so it must not stop today's station prices from publishing.
        continue-on-error: true
        run: python tools/history.py

      - name: Publish the data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          bash scripts/publish-data.sh

      - name: Trigger a Cloudflare build
        run: |
          # Cloudflare builds on a push to main and does not watch the data branch,
          # so without this the site keeps serving the previous snapshot.
          git commit --allow-empty -qm "Refresh snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin HEAD:main
